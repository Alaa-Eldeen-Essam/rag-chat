services:

  # FastAPI Application
  fastapi:
    build:
      context: ..
      dockerfile: docker/minirag/Dockerfile
    image: minirag-fastapi:latest
    container_name: fastapi
    volumes:
      - fastapi_data:/app/assets
    networks:
      - backend
    restart: always
    depends_on:
      pgvector:
        condition: service_healthy
      ollama_chat:
        condition: service_started
      ollama_embed:
        condition: service_started
      # ollama_reranker:
      #   condition: service_started
    env_file:
      - ./env/.env.app
    environment:
      - POSTGRES_HOST=pgvector

  # Ollama service for chat generation
  ollama_chat:
    image: ollama/ollama:latest
    container_name: ollama_chat
    ports:
      - "11434:11434"
    volumes:
      - ollama_chat_data:/root/.ollama
      - ./ollama:/modelfiles
    command: >
      /bin/sh -c "
        ollama serve &
        OL_PID=$$!
        sleep 5 &&
        ollama create qwen-32k -f /modelfiles/qwen-32k.Modelfile || true &&
        wait $$OL_PID
      "
    networks:
      - backend
    restart: always
    gpus: all

  # Ollama service for embeddings
  ollama_embed:
    image: ollama/ollama:latest
    container_name: ollama_embed
    ports:
      - "11436:11434"
    volumes:
      - ollama_embed_data:/root/.ollama
    networks:
      - backend
    restart: always
    gpus: all

  # Dedicated Infinity instance for reranking
  ollama_reranker:
    image: michaelf34/infinity:latest
    container_name: ollama_reranker
    command: v2 --model-id $RERANKER_MODEL_ID --port 11434
    env_file:
      - ./env/.env.app
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    volumes:
      - ollama_reranker_data:/app/.cache/huggingface
    ports:
      - "11435:11434"
    networks:
      - backend
    restart: always

  # vLLM Service for chat
  vllm_chat:
    image: vllm/vllm-openai:latest
    container_name: vllm_chat
    runtime: nvidia
    ipc: host
    command: >
      --host 0.0.0.0
      --port 8000
      --model ${VLLM_CHAT_MODEL_NAME}
      --gpu-memory-utilization 0.7
      --max-model-len 2048
    ports:
      - "8000:8000"
    volumes:
      - vllm_models:/root/.cache/huggingface
    env_file:
      - ./env/.env.app
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    networks:
      - backend
    restart: always
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # vLLM Service for embeddings
  vllm_embed:
    image: vllm/vllm-openai:latest
    container_name: vllm_embed
    runtime: nvidia
    ipc: host
    command: >
      --host 0.0.0.0
      --port 8000
      --model ${VLLM_EMBED_MODEL_NAME}
      --task embed
      --gpu-memory-utilization 0.3
      --max-model-len 512
    ports:
      - "8001:8000"
    volumes:
      - vllm_models:/root/.cache/huggingface
    env_file:
      - ./env/.env.app
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    networks:
      - backend
    restart: always
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Nginx reverse proxy
  nginx:
    image: nginx:stable-alpine3.20-perl
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fastapi
    networks:
      - backend
    restart: always

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - backend
    restart: always

  # ElasticHQ for Elasticsearch monitoring
  elastichq:
    image: elastichq/elasticsearch-hq:release-v3.5.12
    container_name: elastichq
    ports:
      - "5050:5000"
    environment:
      - HQ_DEFAULT_URL=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - backend
    restart: always

  # PostgreSQL (pgvector)
  pgvector:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: pgvector
    ports:
      - "5432:5432"
    volumes:
      - pgvector:/var/lib/postgresql/data
    env_file:
      - ./env/.env.postgres
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # pgAdmin - visual interface for PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:8.10
    container_name: pgadmin
    ports:
      - "${PGADMIN_PORT:-8081}:80"
    env_file:
      - ./env/.env.pgadmin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - pgvector
    networks:
      - backend
    restart: always

  # Postgres metrics exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    env_file:
      - ./env/.env.postgres-exporter
    depends_on:
      - pgvector
    networks:
      - backend
    restart: always

networks:
  backend:
    driver: bridge

volumes:
  fastapi_data:
  pgvector:
  ollama_chat_data:
  ollama_embed_data:
  ollama_reranker_data:
  elasticsearch_data:
  vllm_models:
  pgadmin_data:
