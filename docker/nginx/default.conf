server {
    listen 80;
    server_name localhost;

    # Allow large uploads + slow indexing
    client_max_body_size 100M;
    proxy_connect_timeout 3000;
    proxy_send_timeout 3000;
    proxy_read_timeout 3000;
    send_timeout 3000;

    # All API calls → FastAPI
    location /api/ {
        proxy_pass http://fastapi:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets for SPA (keep full path so /app/assets/... still works)
    location /app/assets/ {
        proxy_pass http://fastapi:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Any other /app/... route → send upstream as /app/
    # This lets FastAPI always serve index.html, and the React router
    # decides whether to show /chat, /stats, /summaries, etc.
    location ~ ^/app(?!/assets/).*$ {
        rewrite ^/app(/.*)?$ /app/ break;
        proxy_pass http://fastapi:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root: send to FastAPI (which already redirects / → /app/)
    location / {
        proxy_pass http://fastapi:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
